<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'">
<meta name="theme-color" content="#2f2640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Babylone">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Le Mystère de Babylone</title>
<!-- Le Mystère de Babylone · Version 2.0 · généré le 2026-10-17
     Aucun traceur, aucun cookie, aucune requête réseau : tout reste sur l'appareil.
     three.js (MIT, Copyright 2010-2023 Three.js Authors) est inclus ci-dessous. -->
<style>:root{
  --ink:#2b2236; --cream:#fbf6ee; --panel:#2f2640; --panel2:#3b3050;
  --pink:#F2B6C6; --green:#6FAF5B; --gold:#F6C26B; --mute:#b8aecb;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2140;color:var(--cream);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;display:flex;gap:8px;pointer-events:auto}
.hudBtn{background:rgba(47,38,64,.82);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;
  box-shadow:0 2px 0 rgba(0,0,0,.25);min-height:44px}
#keysBadge{position:absolute;top:calc(14px + env(safe-area-inset-top));left:12px;background:rgba(47,38,64,.82);
  padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none}
#s2Badge{position:absolute;top:calc(54px + env(safe-area-inset-top));left:12px;background:rgba(115,41,130,.85);
  padding:7px 13px;border-radius:999px;font-size:13px;pointer-events:none;max-width:62vw}
#hint{position:absolute;top:calc(98px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);
  max-width:86vw;background:rgba(251,246,238,.94);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:15px;
  text-align:center;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
#hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
#joy{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
  width:132px;height:132px;border-radius:50%;background:rgba(251,246,238,.16);border:2px solid rgba(251,246,238,.35);
  pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:rgba(251,246,238,.75);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#btnAct{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(38px + env(safe-area-inset-bottom));
  min-width:108px;min-height:108px;padding:10px;border-radius:50%;background:var(--green);color:#173404;font-weight:700;
  font-size:15px;line-height:1.15;pointer-events:auto;box-shadow:0 5px 0 #3b6d11;opacity:0;transform:scale(.7);
  transition:opacity .2s,transform .2s}
#btnAct.show{opacity:1;transform:scale(1)}
#btnAct:active{transform:scale(.94);box-shadow:0 2px 0 #3b6d11}
#toast{position:absolute;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(47,38,64,.92);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;max-width:86vw;text-align:center}
#toast.show{opacity:1}

/* Dialogue */
#dialog{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(560px,94vw);background:var(--cream);color:var(--ink);border-radius:var(--r);padding:16px 18px 12px;
  box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
#dlgName{font-weight:700;color:#7B4FA0;font-size:15px;margin-bottom:4px;min-height:4px}
#dlgText{font-size:17px;line-height:1.5;min-height:52px}
#dlgNext{font-size:12px;color:#8a7f99;text-align:right;margin-top:6px}

/* Panneaux */
#panel{position:fixed;inset:0;background:rgba(20,16,30,.55);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.panelBox{width:min(620px,100vw);max-height:88vh;background:var(--panel);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){#panel{align-items:center}.panelBox{border-radius:22px}}
.panelHead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
#panelTitle{font-size:19px;font-weight:700}
#panelClose{background:var(--panel2);padding:10px 16px;border-radius:999px;min-height:44px}
#panelBody{overflow-y:auto;padding:6px 18px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--panel2);padding:9px 12px;border-radius:999px;font-size:14px;min-height:40px}
.tab.on{background:var(--pink);color:#4B1528;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:var(--panel2);border-radius:14px;padding:12px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:8px}
.card.ghost{opacity:.45;border:2px dashed #6b5f80;background:transparent}
.card .t{font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(255,255,255,.4)}
.sec{font-size:13px;color:var(--mute);margin:14px 0 8px;text-transform:none;letter-spacing:.02em}
.btn{background:var(--panel2);padding:12px 16px;border-radius:12px;min-height:46px;font-weight:600;font-size:15px}
.btn.on{background:var(--pink);color:#4B1528}
.btn.main{background:var(--green);color:#173404;box-shadow:0 3px 0 #3b6d11}
.btn.small{padding:8px 12px;min-height:38px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.step{font-size:13px;color:var(--mute);margin-bottom:6px}
.big{font-size:16px;line-height:1.5}
canvas.preview{display:block;width:100%;max-width:300px;height:auto;margin:6px auto 10px;background:#241d31;border-radius:14px}
.bar{position:relative;height:34px;border-radius:999px;background:#241d31;overflow:hidden;margin:14px 0}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(111,175,91,.55)}
.bar .mark{position:absolute;top:3px;bottom:3px;width:10px;margin-left:-5px;border-radius:6px;background:var(--cream)}
.prog{height:10px;border-radius:999px;background:#241d31;overflow:hidden;margin:8px 0}
.prog>div{height:100%;background:var(--gold);transition:width .15s}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #463a5c;font-size:16px}

/* Écran titre */
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  background:radial-gradient(circle at 50% 35%,rgba(43,34,54,.55),rgba(20,16,30,.88))}
.titleBox{width:min(440px,92vw);text-align:center;padding:20px}
.titleBox h1{font-size:34px;line-height:1.1;margin:0 0 6px;color:var(--cream);letter-spacing:.01em}
.titleBox .sub{color:var(--pink);font-size:15px;margin-bottom:22px}
.titleBox input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:2px solid #5a4d72;
  background:#241d31;color:var(--cream);margin-bottom:6px;-webkit-user-select:text;user-select:text}
.titleBox .note{font-size:12px;color:var(--mute);min-height:18px;margin-bottom:12px}
.titleBox .err{color:#F09595}
.titleBox .btn{width:100%;margin-top:8px;font-size:17px}
.titleBox .foot{margin-top:18px;font-size:11px;color:#8a7f99}
.frogLogo{font-size:46px;margin-bottom:6px}

#fade{position:fixed;inset:0;background:#fbf6ee;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="keysBadge">Objets clés : 0 / 6</div>
  <div id="s2Badge" class="hidden"></div>
  <div id="topbar">
    <button class="hudBtn" id="btnBag">Sac</button>
    <button class="hudBtn" id="btnSet">Réglages</button>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="btnAct"></button>
</div>

<div id="dialog" class="hidden">
  <div id="dlgName"></div>
  <div id="dlgText"></div>
  <div id="dlgNext">Toucher pour continuer</div>
</div>

<div id="panel" class="hidden">
  <div class="panelBox">
    <div class="panelHead"><span id="panelTitle"></span><button id="panelClose">Fermer</button></div>
    <div id="panelBody"></div>
  </div>
</div>

<div id="title">
  <div class="titleBox">
    <div class="frogLogo" aria-hidden="true">🐸</div>
    <h1>Le Mystère de Babylone</h1>
    <div class="sub">Une petite île, onze univers, une grenouille à lunettes.</div>
    <div id="newBox">
      <input id="nick" maxlength="16" placeholder="Ton surnom (pas ton vrai nom)" autocomplete="off" autocapitalize="words" spellcheck="false">
      <div class="note" id="nickNote">Un surnom suffit. Rien ne quitte ton appareil.</div>
      <button class="btn main" id="btnNew">Commencer</button>
    </div>
    <div id="contBox" class="hidden">
      <button class="btn main" id="btnCont">Continuer</button>
      <button class="btn" id="btnRestart">Nouvelle partie</button>
    </div>
    <div class="foot">Version 2.0 · 2026-10-17 · aucun traceur, aucun cookie</div>
  </div>
</div>

<div id="fade"></div>

<script>'use strict';
/* ============ Le Mystère de Babylone · core (utilitaires, sauvegarde, entrées, audio, interface) ============ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- Sauvegarde locale (aucun serveur) ---------------- */
const SAVE_KEY = 'mdb_save_v1';
function defaultState() {
  return {
    v: 1, nick: '', frog: false, story: 0, area: 'room', pos: [-1.4, 0, -1.2],
    items: [], equipped: {}, keys: {}, flags: {}, outfit: 'pyjama',
    settings: { music: true, sfx: true, hints: true }, nextId: 1
  };
}
let S = defaultState();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    const d = defaultState();
    return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) });
  } catch (e) { return null; }
}
function save() {
  if (!S.nick) return; // rien à sauvegarder avant le début d'une partie
  try {
    if (G.player) S.pos = [+G.player.root.position.x.toFixed(2), 0, +G.player.root.position.z.toFixed(2)];
    S.area = G.areaName || S.area;
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  } catch (e) { /* stockage indisponible : le jeu continue sans sauvegarde */ }
}
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }

/* ---------------- État global du jeu ---------------- */
const G = {
  paused: true, dialogOpen: false, panelOpen: false, fading: false,
  player: null, areaName: null, area: null, areas: {}, near: null,
  camMode: 'follow', camTarget: null, camLook: null, t: 0
};

/* ---------------- Entrées : clavier + joystick tactile ---------------- */
const input = { keys: {}, joy: { active: false, id: null, dx: 0, dy: 0 } };
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  input.keys[e.code] = true;
  if (['KeyE', 'Space', 'Enter'].includes(e.code)) {
    e.preventDefault();
    if (G.dialogOpen) dialogAdvance();
    else if (!G.paused && G.near) doAct();
  }
  if (e.code === 'Escape' && G.panelOpen) closePanel();
});
addEventListener('keyup', e => { input.keys[e.code] = false; });
(function setupJoystick() {
  const joy = $('#joy'), knob = $('#joyKnob'), R = 52;
  function setFrom(e) {
    const r = joy.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    input.joy.dx = dx / R; input.joy.dy = dy / R;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  }
  joy.addEventListener('pointerdown', e => {
    input.joy.active = true; input.joy.id = e.pointerId;
    try { joy.setPointerCapture(e.pointerId); } catch (_) { }
    setFrom(e); audioInit();
  });
  joy.addEventListener('pointermove', e => { if (input.joy.active && e.pointerId === input.joy.id) setFrom(e); });
  const end = e => {
    if (e.pointerId !== input.joy.id) return;
    input.joy.active = false; input.joy.dx = input.joy.dy = 0; knob.style.transform = '';
  };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
})();
function readMove() {
  let x = 0, z = 0; const k = input.keys;
  if (k.KeyA || k.ArrowLeft) x -= 1; if (k.KeyD || k.ArrowRight) x += 1;
  if (k.KeyW || k.ArrowUp) z -= 1; if (k.KeyS || k.ArrowDown) z += 1;
  if (input.joy.active) { x = input.joy.dx; z = input.joy.dy; }
  const m = Math.hypot(x, z);
  if (m > 1) { x /= m; z /= m; }
  if (m < 0.12) { x = 0; z = 0; }
  return { x, z };
}

/* ---------------- Audio synthétisé (aucun fichier, aucun droit d'auteur) ---------------- */
const AU = { ctx: null, master: null, music: null, sfx: null, nextChord: 0, nextArp: 0, chordIdx: 0, timer: null };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = new AC(); AU.ctx = c;
  AU.master = c.createGain(); AU.master.gain.value = 0.85; AU.master.connect(c.destination);
  // petite réverbération douce (délai filtré)
  const delay = c.createDelay(1.5); delay.delayTime.value = 0.37;
  const fb = c.createGain(); fb.gain.value = 0.38;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700;
  delay.connect(lp); lp.connect(fb); fb.connect(delay);
  const wet = c.createGain(); wet.gain.value = 0.45; lp.connect(wet); wet.connect(AU.master);
  AU.music = c.createGain(); AU.music.gain.value = S.settings.music ? 0.9 : 0;
  const mlp = c.createBiquadFilter(); mlp.type = 'lowpass'; mlp.frequency.value = 2200;
  AU.music.connect(mlp); mlp.connect(AU.master); mlp.connect(delay);
  AU.sfx = c.createGain(); AU.sfx.gain.value = S.settings.sfx ? 0.6 : 0;
  AU.sfx.connect(AU.master); AU.sfx.connect(delay);
  AU.nextChord = c.currentTime + 0.2; AU.nextArp = c.currentTime + 1.5;
  AU.timer = setInterval(musicTick, 200);
}
function tone(freq, t, dur, o = {}) {
  const c = AU.ctx; if (!c) return null;
  const osc = c.createOscillator(), g = c.createGain();
  const gain = o.gain ?? 0.1, att = o.attack ?? 0.01, rel = Math.min(o.release ?? 0.3, dur);
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + att);
  g.gain.setValueAtTime(gain, t + Math.max(att, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.dest || AU.sfx);
  osc.start(t); osc.stop(t + dur + 0.05);
  return osc;
}
// Progression douce et apaisante : Cmaj7 · Am7 · Fmaj7 · G6
const CHORDS = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 59]];
const PENTA = [72, 74, 76, 79, 81, 84, 86];
function musicTick() {
  const c = AU.ctx; if (!c || c.state !== 'running') return;
  const now = c.currentTime;
  while (AU.nextChord < now + 0.6) {
    if (AU.nextChord < now) AU.nextChord = now + 0.05;
    const ch = CHORDS[AU.chordIdx % CHORDS.length];
    ch.forEach((m, i) => tone(mtof(m), AU.nextChord, 6, { type: i === 0 ? 'triangle' : 'sine', gain: i === 0 ? 0.05 : 0.032, attack: 1.8, release: 2.5, dest: AU.music }));
    AU.chordIdx++; AU.nextChord += 4.5;
  }
  while (AU.nextArp < now + 0.6) {
    if (AU.nextArp < now) AU.nextArp = now + 0.05;
    if (Math.random() < 0.5) tone(mtof(pick(PENTA)), AU.nextArp, 2, { gain: 0.03, attack: 0.008, release: 1.9, dest: AU.music });
    AU.nextArp += Math.random() < 0.3 ? 1.1 : 0.55;
  }
}
function setMusic(on) { S.settings.music = on; if (AU.music) AU.music.gain.setTargetAtTime(on ? 0.9 : 0, AU.ctx.currentTime, 0.4); save(); }
function setSfx(on) { S.settings.sfx = on; if (AU.sfx) AU.sfx.gain.setTargetAtTime(on ? 0.6 : 0, AU.ctx.currentTime, 0.05); save(); }
function sfx(name) {
  const c = AU.ctx; if (!c || !S.settings.sfx) return;
  const t = c.currentTime + 0.01;
  switch (name) {
    case 'tink': tone(rand(1900, 2300), t, 0.35, { gain: 0.12, release: 0.32 }); tone(3150, t, 0.2, { gain: 0.04, release: 0.18 }); break;
    case 'pop': tone(520, t, 0.12, { gain: 0.1, glide: 880, release: 0.1 }); break;
    case 'soft': tone(660, t, 0.18, { gain: 0.06, type: 'triangle', release: 0.15 }); break;
    case 'chime': [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * 0.09, 1.2, { type: 'triangle', gain: 0.09, release: 1.1 })); break;
    case 'boing': tone(320, t, 0.5, { type: 'triangle', gain: 0.12, glide: 110, release: 0.4 }); tone(480, t + 0.12, 0.35, { type: 'sine', gain: 0.06, glide: 200 }); break;
    case 'ribbit': for (let i = 0; i < 2; i++) { tone(160, t + i * 0.22, 0.16, { type: 'square', gain: 0.07, glide: 240, release: 0.1 }); } break;
    case 'door': tone(140, t, 0.3, { type: 'triangle', gain: 0.12, glide: 90 }); break;
    case 'sparkle': for (let i = 0; i < 6; i++) tone(mtof(pick(PENTA) + 12), t + i * 0.07, 0.6, { gain: 0.05, release: 0.55 }); break;
    case 'drop': for (let i = 0; i < 5; i++) tone(rand(900, 1500), t + i * 0.06 + rand(0, 0.03), 0.12, { gain: 0.06, glide: rand(400, 600), release: 0.1 }); break;
    case 'whoosh': tone(900, t, 0.6, { type: 'sine', gain: 0.05, glide: 200, attack: 0.2 }); break;
  }
}

const DLG = { queue: [], done: null, typing: null, full: '' };
function dialog(lines, done) {
  DLG.queue = lines.slice(); DLG.done = done || null;
  G.dialogOpen = true; $('#dialog').classList.remove('hidden'); $('#btnAct').classList.remove('show');
  dialogShowNext();
}
function dialogShowNext() {
  const l = DLG.queue.shift();
  if (!l) { $('#dialog').classList.add('hidden'); G.dialogOpen = false; const d = DLG.done; DLG.done = null; if (d) d(); return; }
  if (l.fx) l.fx();
  $('#dlgName').textContent = l.name || '';
  const txt = (l.text || '').replace(/\{nick\}/g, S.nick || 'petite grenouille');
  DLG.full = txt; const el = $('#dlgText'); el.textContent = '';
  let i = 0; clearInterval(DLG.typing);
  DLG.typing = setInterval(() => { i += 2; el.textContent = txt.slice(0, i); if (i >= txt.length) { clearInterval(DLG.typing); DLG.typing = null; } }, 22);
  if (l.name) sfx('soft');
}
function dialogAdvance() {
  if (DLG.typing) { clearInterval(DLG.typing); DLG.typing = null; $('#dlgText').textContent = DLG.full; return; }
  dialogShowNext();
}
$('#dialog').addEventListener('click', () => { audioInit(); dialogAdvance(); });

let panelOnClose = null;
function openPanel(title, render, onClose) {
  G.panelOpen = true; panelOnClose = onClose || null;
  $('#panelTitle').textContent = title; $('#panel').classList.remove('hidden');

}
function closePanel() {

const BAG_SECTIONS = [];   // sections de la Collection, ajoutées par chaque univers

function tapStep(el, head, label, n, snd, onDone) {
  let k = 0;
  el.innerHTML = head + `<div class="prog" style="margin:14px 0"><div id="tsBar" style="width:0%"></div></div><div id="tsTxt" class="step">0 / ${n}</div>

    if (k >= n) { sfx('sparkle'); G.tTimer = setTimeout(onDone, 380); }

function timingStep(el, head, label, onDone) {
  el.innerHTML = head + `<div class="bar"><div class="zone" style="left:32%;width:36%"></div><div class="mark" id="mk"></div></div>
    <button class="btn main" id="tGo" style="width:100%;min-height:64px;font-size:18px">${label}</button>`;
  const mk = $('#mk'), t0 = performance.now(); let pos = 0;
  cancelAnimationFrame(G.tRAF);
  const anim = now => { pos = (Math.sin((now - t0) / 950) + 1) / 2; mk.style.left = (pos * 100) + '%'; G.tRAF = requestAnimationFrame(anim); };
  G.tRAF = requestAnimationFrame(anim);
  $('#tGo').onclick = () => { cancelAnimationFrame(G.tRAF); onDone(pos >= 0.32 && pos <= 0.68); };
}

}

/* ============ Modèles codés : héroïne, robot de base, bijoux, textures ============ */
/* Emplacement prévu : remplacer makeHeroine()/makeRobot() par le chargement de Soldate.glb / Robot.glb
   (même interface : root, update(t, speed), setFrog(), anchors). */
const MAT = {};
function M(color, o = {}) {
  const k = color + '|' + JSON.stringify(o);
  return MAT[k] || (MAT[k] = new THREE.MeshPhongMaterial(Object.assign({ color, flatShading: true, shininess: 6 }, o)));
}
function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; }
function box(w, h, d, mat, x, y, z) { return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z); }
function cyl(rt, rb, h, seg, mat, x, y, z) { return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z); }
function ball(r, mat, x, y, z, det = 1) { return mesh(new THREE.IcosahedronGeometry(r, det), mat, x, y, z); }

/* ---------- Finitions des bijoux ---------- */
const FINISH = {
  argent: { label: 'argent', color: 0xC0C4CC, mat: () => M(0xC0C4CC, { shininess: 70, specular: 0xffffff }) },
  chrome: { label: 'chrome', color: 0xE6EBF0, mat: () => M(0xE6EBF0, { shininess: 140, specular: 0xffffff }) },
  noirBrillant: { label: 'noir brillant', color: 0x18181b, mat: () => M(0x18181b, { shininess: 120, specular: 0x9a9aa6 }) },
  noirMat: { label: 'noir mat', color: 0x2a2a2f, mat: () => M(0x2a2a2f, { shininess: 1, specular: 0x111111 }) }
};
const SIZE = { petit: { label: 'petits anneaux', k: 0.7 }, moyen: { label: 'anneaux moyens', k: 1 }, gros: { label: 'gros anneaux', k: 1.4 } };
const SPIKE = { court: { label: 'courts' }, long: { label: 'longs' }, pyramide: { label: 'pyramide' } };
const JTYPE = {
  collier: { label: 'Collier', rings: 14, maxSpikes: 5 },
  bracelet: { label: 'Bracelet', rings: 9, maxSpikes: 5 },
  boucles: { label: "Boucles d'oreilles", rings: 4, maxSpikes: 1 },
  bague: { label: 'Bague', rings: 5, maxSpikes: 1 },
  chaine: { label: 'Chaîne de pantalon', rings: 10, maxSpikes: 3 },
  septum: { label: 'Piercing septum', rings: 3, maxSpikes: 1 },
  narine: { label: 'Piercing narine', rings: 3, maxSpikes: 1 }
};

function spikeGeo(shape, k) {
  if (shape === 'pyramide') return new THREE.ConeGeometry(0.022 * k, 0.06 * k, 4);
  if (shape === 'long') return new THREE.ConeGeometry(0.016 * k, 0.11 * k, 6);
  return new THREE.ConeGeometry(0.018 * k, 0.05 * k, 6);
}
/* Bijou 3D porté par l'héroïne */
function makeJewelMesh(item) {
  const g = new THREE.Group();
  const mat = FINISH[item.finish].mat();
  const k = SIZE[item.size].k;
  const wob = item.wonky ? 1 : 0;
  const addSpikesAround = (r, n, arcStart, arcLen, axisY) => {
    for (let i = 0; i < n; i++) {
      const a = arcStart + arcLen * (n === 1 ? 0.5 : i / (n - 1));
      const s = mesh(spikeGeo(item.spike, k), mat);
      if (axisY) { s.position.set(Math.sin(a) * r, 0, Math.cos(a) * r); s.rotation.set(Math.PI / 2, a, 0, 'YXZ'); }
      else { s.position.set(Math.sin(a) * r, -Math.cos(a) * r, 0); s.rotation.z = a + Math.PI; }
      g.add(s);
    }
  };
  switch (item.type) {
    case 'collier': {
      const t = mesh(new THREE.TorusGeometry(0.2, 0.022 * k, 6, 26), mat); t.rotation.x = Math.PI / 2 + wob * 0.35; g.add(t);
      addSpikesAround(0.2, item.spikes, -0.9, 1.8, true); break;
    }
    case 'bracelet': {
      const t = mesh(new THREE.TorusGeometry(0.085, 0.017 * k, 6, 18), mat); t.rotation.x = Math.PI / 2 + wob * 0.5; g.add(t);
      addSpikesAround(0.085, item.spikes, -1.2, 2.4, true); break;
    }
    case 'boucles': {
      [-1, 1].forEach(sd => { const t = mesh(new THREE.TorusGeometry(0.045, 0.011 * k, 5, 14), mat); t.position.x = sd * 0.02; t.position.y = -0.05 - (wob && sd > 0 ? 0.04 : 0); t.rotation.y = Math.PI / 2; g.add(t); });
      break;
    }
    case 'bague': { const t = mesh(new THREE.TorusGeometry(0.04, 0.013 * k, 5, 12), mat); t.rotation.x = Math.PI / 2 + wob * 0.6; g.add(t); break; }
    case 'chaine': {
      const t = mesh(new THREE.TorusGeometry(0.15, 0.012 * k, 4, 18, Math.PI), mat); t.rotation.z = Math.PI + wob * 0.4; t.rotation.y = Math.PI / 2; g.add(t);
      break;
    }
    case 'septum': { const t = mesh(new THREE.TorusGeometry(0.035, 0.009 * k, 5, 12), mat); t.position.y = -0.03; t.rotation.z = wob * 0.6; g.add(t); break; }
    case 'narine': { const t = mesh(new THREE.TorusGeometry(0.024, 0.008 * k, 5, 10), mat); t.rotation.y = Math.PI / 2 + wob * 0.7; g.add(t); break; }
  }
  return g;
}

/* ---------- L'héroïne (proportions chibi de la Soldate) ---------- */
function makeHeroine() {
  const root = new THREE.Group();
  const skin = M(0xF2D3B3), pj = M(0xE6E0F0), pjDark = M(0xCFC6E0), hair = M(0x1E1B1E, { shininess: 25 });
  const frogSkin = M(0x6FAF5B), frogBelly = M(0xC9E3A6), lens = M(0x3A3A44, { shininess: 60 });
  const body = new THREE.Group(); root.add(body);

  // ombre douce
  const shadow = mesh(new THREE.CircleGeometry(0.42, 18), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.012; root.add(shadow);

  const torso = box(0.52, 0.5, 0.34, pj, 0, 0.62, 0); body.add(torso);
  const collar = box(0.3, 0.05, 0.3, pjDark, 0, 0.88, 0); body.add(collar);
  const buttons = [-1, 1].map(s => { const b = ball(0.035, pjDark, 0, 0.72 - 0.12 * (s + 1), 0.175, 0); body.add(b); return b; }); // boutons

  const limbs = {};
  function limb(name, x, y, len, r, mat, endMat, endR) {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    const m = cyl(r, r * 0.9, len, 7, mat, 0, -len / 2, 0); p.add(m);
    const end = ball(endR, endMat, 0, -len - endR * 0.4, 0); p.add(end);
    body.add(p); limbs[name] = { pivot: p, end, sleeve: m }; return p;
  }
  limb('armL', -0.33, 0.84, 0.36, 0.075, pj, skin, 0.075);
  limb('armR', 0.33, 0.84, 0.36, 0.075, pj, skin, 0.075);
  limb('legL', -0.13, 0.38, 0.3, 0.095, pj, skin, 0.085);
  limb('legR', 0.13, 0.38, 0.3, 0.095, pj, skin, 0.085);
  ['legL', 'legR'].forEach(n => limbs[n].end.scale.set(1.1, 0.6, 1.5));

  // ---- Tenue witchy goth : robe noire évasée, corset velours prune à lacets, manches cloches,
  //      collants rayés noir et violet, bottines vernies, pendentif lune
  const velvet = M(0x2a1a33, { shininess: 18, specular: 0x553366 }), black = M(0x141216, { shininess: 8 });
  const blackDS = M(0x141216, { shininess: 8, side: THREE.DoubleSide }), laceDS = M(0x5B3A8C, { shininess: 10, side: THREE.DoubleSide });
  const silver = M(0xC0C4CC, { shininess: 90, specular: 0xffffff }), bootM = M(0x111014, { shininess: 80, specular: 0x777777 });
  const stripe = document.createElement('canvas'); stripe.width = 8; stripe.height = 32;
  { const x = stripe.getContext('2d'); for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#5B3A8C' : '#151217'; x.fillRect(0, i * 8, 8, 8); } }
  const stripeTex = new THREE.CanvasTexture(stripe); stripeTex.wrapS = stripeTex.wrapT = THREE.RepeatWrapping; stripeTex.repeat.set(1, 3); stripeTex.magFilter = THREE.NearestFilter;
  const stockings = new THREE.MeshPhongMaterial({ map: stripeTex, shininess: 8 });
  const goth = new THREE.Group(); goth.visible = false; body.add(goth);
  goth.add(mesh(new THREE.CylinderGeometry(0.27, 0.5, 0.38, 12, 1, true), blackDS, 0, 0.24, 0));
  goth.add(mesh(new THREE.CylinderGeometry(0.505, 0.51, 0.04, 12, 1, true), laceDS, 0, 0.065, 0));
  goth.add(mesh(new THREE.CylinderGeometry(0.272, 0.272, 0.04, 12), M(0x5B3A8C), 0, 0.43, 0));
  for (let i = 0; i < 3; i++) [-1, 1].forEach(sd => { const l = box(0.13, 0.012, 0.01, M(0xB89BD9), 0, 0.5 + i * 0.09, 0.173); l.rotation.z = sd * 0.55; goth.add(l); });
  const moon = mesh(new THREE.TorusGeometry(0.04, 0.011, 5, 12, Math.PI * 1.25), silver, 0.0, 0.76, 0.18); moon.rotation.z = -0.4; goth.add(moon);
  const gothExtras = [];
  ['armL', 'armR'].forEach(n => { const bell = mesh(new THREE.CylinderGeometry(0.08, 0.15, 0.15, 9, 1, true), blackDS, 0, -0.3, 0); bell.visible = false; limbs[n].pivot.add(bell); gothExtras.push(bell);
    const edge = mesh(new THREE.CylinderGeometry(0.152, 0.155, 0.025, 9, 1, true), laceDS, 0, -0.37, 0); edge.visible = false; limbs[n].pivot.add(edge); gothExtras.push(edge); });
  ['legL', 'legR'].forEach(n => { const shaft = cyl(0.1, 0.1, 0.13, 8, bootM, 0, -0.25, 0); shaft.visible = false; limbs[n].pivot.add(shaft); gothExtras.push(shaft); });


  // ---- Tête humaine : cheveux noirs mi-longs à grosses boucles + lunettes rondes
  const head = new THREE.Group(); head.position.y = 1.24; body.add(head);
  const human = new THREE.Group(); head.add(human);
  human.add(ball(0.42, skin, 0, 0, 0, 2));
  [-1, 1].forEach(s => {
    human.add(ball(0.045, M(0x2b2236), s * 0.14, 0.0, 0.39, 1));
    const bl = ball(0.05, M(0xF0A9A9), s * 0.24, -0.1, 0.33, 1); bl.scale.set(1, 0.6, 0.4); human.add(bl);
  });
  const mouthH = mesh(new THREE.TorusGeometry(0.045, 0.012, 4, 10, Math.PI), M(0x8a4b4b)); mouthH.position.set(0, -0.15, 0.39); mouthH.rotation.z = Math.PI; human.add(mouthH);
  const rnd = seeded(7);
  const curlGeo = new THREE.IcosahedronGeometry(1, 1);
  const addCurl = (x, y, z, r) => { const c = mesh(curlGeo, hair, x, y, z); c.scale.setScalar(r); human.add(c); };
  for (let i = 0; i < 70; i++) { // calotte bouclée
    const th = rnd() * Math.PI * 2, ph = rnd() * Math.PI * 0.62;
    const x = Math.sin(ph) * Math.cos(th), y = Math.cos(ph), z = Math.sin(ph) * Math.sin(th);
    if (z > 0.35 && y < 0.62) continue; // dégager le visage
    addCurl(x * 0.44, y * 0.44 + 0.02, z * 0.44, 0.1 + rnd() * 0.06);
  }
  for (let i = 0; i < 30; i++) { // longueurs mi-longues : jusqu'aux épaules
    const a = Math.PI * 0.12 + rnd() * Math.PI * 0.76; // de côté à côté, par l'arrière
    const yy = -0.05 - rnd() * 0.33;
    const rr = 0.37 + rnd() * 0.07;
    addCurl(Math.cos(a) * rr * 1.05, yy, -Math.sin(a) * rr * 0.78 - 0.04, 0.11 + rnd() * 0.05);
  }
  [-1, 1].forEach(s => { for (let i = 0; i < 3; i++) addCurl(s * (0.39 + rnd() * 0.04), 0.04 - i * 0.14, 0.08 - rnd() * 0.1, 0.1 + rnd() * 0.03); });
  function glasses(r, y, z, spread, scale) {
    const gl = new THREE.Group();
    [-1, 1].forEach(s => {
      const ring = mesh(new THREE.TorusGeometry(r, 0.017 * scale, 6, 18), lens); ring.position.set(s * spread, y, z); gl.add(ring);
      const glass = mesh(new THREE.CircleGeometry(r * 0.92, 16), new THREE.MeshPhongMaterial({ color: 0xdfefff, transparent: true, opacity: 0.18, shininess: 120 })); glass.position.set(s * spread, y, z - 0.002); gl.add(glass);
      const arm = box(0.016, 0.016, 0.3, lens, s * (spread + r), y, z - 0.15); gl.add(arm);
    });
    gl.add(box(spread * 2 - r * 2 + 0.02, 0.016, 0.016, lens, 0, y + r * 0.2, z));
    return gl;
  }
  human.add(glasses(0.1, 0.0, 0.43, 0.14, 1));

  // ---- Tête de grenouille : chauve, garde ses lunettes
  const frog = new THREE.Group(); head.add(frog); frog.visible = false;
  const fh = ball(0.42, frogSkin, 0, -0.02, 0, 2); fh.scale.set(1.18, 0.86, 1.02); frog.add(fh);
  const chin = ball(0.3, frogBelly, 0, -0.16, 0.16, 2); chin.scale.set(1.25, 0.6, 1); frog.add(chin);
  const eyes = [];
  [-1, 1].forEach(s => {
    const lid = ball(0.16, frogSkin, s * 0.2, 0.3, 0.1, 2); frog.add(lid);
    const white = ball(0.125, M(0xFBFBF2, { shininess: 40 }), s * 0.2, 0.32, 0.17, 2); frog.add(white);
    const pupil = ball(0.06, M(0x15151a, { shininess: 80 }), s * 0.2, 0.33, 0.29, 1); frog.add(pupil); eyes.push(pupil);
    frog.add(ball(0.018, M(0x2b3a22), s * 0.06, 0.02, 0.44, 0)); // narines
  });
  const mouthF = mesh(new THREE.TorusGeometry(0.27, 0.018, 4, 18, Math.PI * 0.8), M(0x3b5a2a)); mouthF.position.set(0, -0.02, 0.27); mouthF.rotation.set(-0.35, 0, Math.PI + Math.PI * 0.1); frog.add(mouthF);
  frog.add(glasses(0.14, 0.32, 0.33, 0.2, 1.2));

  // ---- Points d'attache des bijoux (un jeu par tête)
  const A = {
    human: { earL: [-0.42, -0.06, 0.02], earR: [0.42, -0.06, 0.02], nose: [0, -0.07, 0.42], nostril: [0.05, -0.06, 0.41] },
    frog: { earL: [-0.47, 0.0, 0.0], earR: [0.47, 0.0, 0.0], nose: [0, 0.0, 0.45], nostril: [0.07, 0.02, 0.44] }
  };
  const headJewels = new THREE.Group(); head.add(headJewels);

  const P = {
    root, body, head, human, frog, limbs, eyes, isFrog: false, walkPhase: 0, facing: 0,
    outfit: 'pyjama',
    setFrog(b) {
      P.isFrog = b; human.visible = !b; frog.visible = b;
      P.applySkin(); P.refreshJewels();
    },
    applySkin() {
      const handM = P.isFrog ? frogSkin : skin;
      limbs.armL.end.material = limbs.armR.end.material = handM;
      limbs.legL.end.material = limbs.legR.end.material = P.outfit === 'goth' ? bootM : handM;
    },
    setOutfit(name) {
      const g = name === 'goth'; P.outfit = g ? 'goth' : 'pyjama';
      torso.material = g ? velvet : pj; collar.visible = !g; buttons.forEach(b => b.visible = !g);
      goth.visible = g; gothExtras.forEach(m => m.visible = g);
      limbs.armL.sleeve.material = limbs.armR.sleeve.material = g ? black : pj;
      limbs.legL.sleeve.material = limbs.legR.sleeve.material = g ? stockings : pj;
      P.applySkin();
    },
    refreshJewels() {
      const holders = [body, limbs.armL.pivot, limbs.armR.pivot];
      holders.forEach(par => par.children.filter(c => c.name === 'jw').forEach(c => par.remove(c)));
      while (headJewels.children.length) headJewels.remove(headJewels.children[0]);
      const anc = P.isFrog ? A.frog : A.human;
      for (const type in S.equipped) {
        const it = S.items.find(i => i.id === S.equipped[type]); if (!it) continue;
        const add = (parent, pos) => { const j = makeJewelMesh(it); j.position.set(...pos); j.name = 'jw'; parent.add(j); return j; };
        if (type === 'collier') add(body, [0, 0.9, 0]);
        if (type === 'bracelet') add(limbs.armL.pivot, [0, -0.34, 0]);
        if (type === 'bague') add(limbs.armR.pivot, [0, -0.43, 0.02]);
        if (type === 'chaine') add(body, [0.27, 0.42, 0.05]);
        if (type === 'boucles') { add(headJewels, anc.earL); add(headJewels, anc.earR); }
        if (type === 'septum') add(headJewels, anc.nose);
        if (type === 'narine') add(headJewels, anc.nostril);
      }
    },
    update(t, speed) {
      const k = clamp(speed / 3, 0, 1);
      P.walkPhase += speed * 0.016 * 3.2;
      const sw = Math.sin(P.walkPhase) * 0.7 * k;
      limbs.armL.pivot.rotation.x = sw; limbs.armR.pivot.rotation.x = -sw;
      limbs.legL.pivot.rotation.x = -sw; limbs.legR.pivot.rotation.x = sw;
      body.position.y = Math.abs(Math.sin(P.walkPhase)) * 0.06 * k + Math.sin(t * 2) * 0.01 * (1 - k);
      head.rotation.z = Math.sin(t * 1.3) * 0.03 * (1 - k);
      eyes.forEach((e, i) => e.scale.y = (Math.sin(t * 0.9 + i * 0.1) > 0.985) ? 0.15 : 1); // clignement
    }
  };
  return P;
}

function textSprite(text, o = {}) {

/* Rideaux forestiers : herbes et fleurs à l'aquarelle sur fond anthracite (motif original inspiré de la référence) */
function curtainTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#4A4A4E'; x.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 256; i += 18) { x.fillStyle = i % 36 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.03)'; x.fillRect(i, 0, 9, 512); }
  const rnd = seeded(42);
  const leafCols = ['#8FAF8F', '#7FA08A', '#9DB89A', '#6E8F7A'];
  function stem(sx, sy, len, lean) {
    x.strokeStyle = 'rgba(160,190,160,0.75)'; x.lineWidth = 2; x.beginPath(); x.moveTo(sx, sy);
    const ex = sx + lean, ey = sy - len; x.quadraticCurveTo(sx + lean * 0.3, sy - len * 0.5, ex, ey); x.stroke();
    return [ex, ey];
  }
  function leaf(px, py, ang, s, col) {
    x.save(); x.translate(px, py); x.rotate(ang); x.fillStyle = col; x.globalAlpha = 0.85;
    x.beginPath(); x.ellipse(0, -s, s * 0.45, s, 0, 0, Math.PI * 2); x.fill(); x.restore();
  }
  for (let n = 0; n < 9; n++) {
    const sx = 14 + rnd() * 228, sy = 120 + rnd() * 400, len = 70 + rnd() * 110, lean = (rnd() - 0.5) * 50;
    const [ex, ey] = stem(sx, sy, len, lean);
    const kind = Math.floor(rnd() * 4);
    for (let k = 0.25; k < 1; k += 0.18) {
      const px = lerp(sx, ex, k), py = lerp(sy, ey, k);
      leaf(px, py, -0.9, 7 + rnd() * 5, pick(leafCols)); leaf(px, py, 0.9, 7 + rnd() * 5, pick(leafCols));
    }
    x.globalAlpha = 0.88;
    if (kind === 0) { for (let d = 0; d < 14; d++) { x.fillStyle = rnd() > 0.5 ? '#D8A0B8' : '#C98AA6'; x.beginPath(); x.ellipse(ex + (rnd() - 0.5) * 34, ey + (rnd() - 0.5) * 30, 4, 6, rnd(), 0, Math.PI * 2); x.fill(); } }
    if (kind === 1) { x.fillStyle = '#E9B94A'; for (let p = 0; p < 4; p++) { x.beginPath(); x.ellipse(ex + Math.cos(p * 1.57) * 7, ey + Math.sin(p * 1.57) * 7, 6, 8, p * 1.57, 0, Math.PI * 2); x.fill(); } }
    if (kind === 2) { x.fillStyle = '#A8D5DA'; for (let p = 0; p < 7; p++) { x.beginPath(); x.ellipse(ex + (rnd() - 0.5) * 12, ey + p * 7, 5, 4, 0, 0, Math.PI * 2); x.fill(); } }
    if (kind === 3) { for (let d = 0; d < 6; d++) leaf(ex, ey + d * 9, (d % 2 ? 1 : -1) * 1.1, 9, '#6E8F7A'); }
    x.globalAlpha = 1;
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function dayInfo() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  let f = 0;
  if (h >= 7 && h < 18) f = 1; else if (h >= 5 && h < 7) f = (h - 5) / 2; else if (h >= 18 && h < 21) f = 1 - (h - 18) / 3;
  const dusk = clamp(1 - Math.abs(h - 19) / 1.6, 0, 1) + clamp(1 - Math.abs(h - 6.3) / 1.2, 0, 1);

}

function garden() {
  if (!S.garden) S.garden = {};

function gardenTick() {
  const gd = garden(), now = G.now();
  gd.plots.forEach((p, i) => {
    if (!p) return;
    const el = Math.max(0, now - (p.last || now));
    const awake = Math.min(el, Math.max(0, p.water));
    p.prog = Math.min(growMs(p, i), p.prog + awake);

}

}

  el.innerHTML = `<div class="big" style="font-weight:700">${v.label}</div><div class="step">${stLbl}</div>

/* ---------- Texture du sable ratissé ---------- */
const ZEN_ROCKS = [[0.3, 0.35], [0.68, 0.6], [0.45, 0.78]];
function sandTexture(pattern) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 372; const x = c.getContext('2d');
  x.fillStyle = '#E9DFC9'; x.fillRect(0, 0, 512, 372);
  const rnd = seeded(9); for (let i = 0; i < 2500; i++) { x.fillStyle = rnd() > 0.5 ? 'rgba(120,100,70,0.10)' : 'rgba(255,255,255,0.25)'; x.fillRect(rnd() * 512, rnd() * 372, 1.5, 1.5); }
  x.lineWidth = 3; x.lineCap = 'round';
  const groove = () => { x.strokeStyle = 'rgba(150,128,95,0.55)'; x.stroke(); };
  if (pattern === 'vagues' || pattern === 'lignes') {
    for (let y = 14; y < 372; y += 16) { x.beginPath(); for (let px = 0; px <= 512; px += 8) { const yy = y + (pattern === 'vagues' ? Math.sin(px / 34 + y / 50) * 6 : 0); px ? x.lineTo(px, yy) : x.moveTo(px, yy); } groove(); }
  } else if (pattern === 'spirale') {
    x.beginPath(); for (let t = 0; t < 70; t += 0.05) { const r = t * 3.4, px = 256 + Math.cos(t) * r, py = 186 + Math.sin(t) * r * 0.75; t ? x.lineTo(px, py) : x.moveTo(px, py); } groove();
  } else {
    for (let y = 14; y < 372; y += 16) { x.beginPath(); x.moveTo(0, y); x.lineTo(512, y); groove(); }
  }
  ZEN_ROCKS.forEach(([u, v]) => { // cercles concentriques autour des rochers (tous les motifs)
    x.fillStyle = '#E9DFC9'; x.beginPath(); x.ellipse(u * 512, v * 372, 58, 46, 0, 0, 6.28); x.fill();
    for (let r = 26; r <= 58; r += 11) { x.beginPath(); x.ellipse(u * 512, v * 372, r, r * 0.8, 0, 0, 6.28); groove(); }
  });
  return new THREE.CanvasTexture(c);
}

/* ---------- Glouglo et Baby Lone ---------- */
function makeGlouglo() {
  const g = new THREE.Group(), blue = M(0x378ADD, { shininess: 60 }), light = M(0x85B7EB, { shininess: 60 });
  const body = ball(0.16, blue, 0, 0, 0, 2); body.scale.set(1.35, 0.95, 0.85); g.add(body);
  const belly = ball(0.12, light, 0.02, -0.05, 0, 1); belly.scale.set(1.2, 0.6, 0.8); g.add(belly);
  const tail = mesh(new THREE.ConeGeometry(0.1, 0.16, 4), blue, -0.26, 0, 0); tail.rotation.z = Math.PI / 2; g.add(tail); g.tail = tail;
  const fin = mesh(new THREE.ConeGeometry(0.05, 0.1, 3), light, 0, 0.15, 0); g.add(fin);
  [-1, 1].forEach(s => { g.add(ball(0.05, M(0xffffff, { shininess: 80 }), 0.13, 0.05, s * 0.09, 1)); g.add(ball(0.025, M(0x111111), 0.16, 0.05, s * 0.11, 0)); });
  return g;
}
function tieDyeMat() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const cols = ['#F25C8A', '#FFD23F', '#2BB5B0', '#7B4FA0', '#F28C38', '#6FAF5B'];
  for (let r = 96; r > 0; r -= 9) { x.fillStyle = cols[(r / 9 | 0) % cols.length]; x.beginPath(); for (let a = 0; a <= 6.3; a += 0.2) { const rr = r + Math.sin(a * 5 + r) * 7; x.lineTo(64 + Math.cos(a) * rr, 64 + Math.sin(a) * rr); } x.fill(); }
  return new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(c), flatShading: true, shininess: 8 });
}
function peacePlane() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#FBF6EE'; x.beginPath(); x.arc(32, 32, 30, 0, 6.28); x.fill();
  x.strokeStyle = '#2b2236'; x.lineWidth = 5; x.beginPath(); x.arc(32, 32, 22, 0, 6.28); x.stroke();
  x.beginPath(); x.moveTo(32, 10); x.lineTo(32, 54); x.moveTo(32, 32); x.lineTo(16, 48); x.moveTo(32, 32); x.lineTo(48, 48); x.stroke();
  return mesh(new THREE.CircleGeometry(0.06, 16), new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
}
function makeBabyLone() {
  const r = makeRobot({ bodyMat: tieDyeMat(), band: 0xE8E2D0, browTilt: 0.2 });
  [-1, 1].forEach(s => { const gl = mesh(new THREE.CircleGeometry(0.13, 16), M(0x2b1f3a, { shininess: 120, specular: 0xaa88ff })); gl.position.set(s * 0.17, -0.01, 0.47); r.head.add(gl); const fr = mesh(new THREE.TorusGeometry(0.135, 0.015, 5, 16), M(0xD9A441, { shininess: 60 })); fr.position.copy(gl.position); r.head.add(fr); });
  const pc = peacePlane(); pc.position.set(0.13, 0.72, 0.245); r.body.add(pc);
  const cup = cyl(0.05, 0.04, 0.08, 8, M(0xFBF6EE), 0, -0.68, 0.08); r.arms[1].add(cup);
  r.steam = []; for (let i = 0; i < 3; i++) { const st = ball(0.025, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }), 0, -0.6, 0.08, 0); r.arms[1].add(st); r.steam.push(st); }
  return r;
}

/* ---------- Le jardin ---------- */

  ZEN_ROCKS.forEach(([u, v], i) => { const r = ball(0.2 + i * 0.05, M(0x8E8E8A), -4.4 + u * 4.4, 0.12, -2.5 + v * 3.2, 0); r.scale.y = 0.7; g.add(r); });

  a.interact.push({ x: -2.2, z: 1.15, r: 0.8, label: 'Râteau', act: () => G.openRake() });

function abstractify(cv) { // « période abstraite » : décalages et gribouillis joyeux
  const x = cv.getContext('2d'), copy = document.createElement('canvas'); copy.width = copy.height = 300; copy.getContext('2d').drawImage(cv, 0, 0);
  x.clearRect(0, 0, 300, 300);

const HAB = { list: [] };
G.spawnInhabitants = function () {

  HAB.list.forEach(h => isl.group.remove(h.sp)); HAB.list = [];
  craftState().habs.slice(0, MAX_HAB).forEach((h, i) => {

    const an = i * 0.9, rr = 6 + (i % 4) * 2.5; const p = { x: Math.cos(an) * rr, z: Math.sin(an) * rr };
    sp.position.set(p.x, HAB_SIZE * 0.4, p.z); isl.group.add(sp);
    HAB.list.push({ sp, p, tgt: null, wait: Math.random() * 2, ph: Math.random() * 6 });

};
G.updateInhabitants = function (t, dt) {
  const isl = G.areas.island;
  HAB.list.forEach(h => {
    if (h.wait > 0) { h.wait -= dt; } else {
      if (!h.tgt) { const an = Math.random() * 6.28, rr = 4 + Math.random() * 18; h.tgt = { x: Math.cos(an) * rr, z: Math.sin(an) * rr }; }
      const dx = h.tgt.x - h.p.x, dz = h.tgt.z - h.p.z, d = Math.hypot(dx, dz);
      if (d < 0.2) { h.tgt = null; h.wait = 1 + Math.random() * 3; }
      else { h.p.x += dx / d * 0.7 * dt; h.p.z += dz / d * 0.7 * dt; }
      for (const c of isl.colliders) { // contourner maisons et arbres
        if (c.t === 'c') { const ex = h.p.x - c.x, ez = h.p.z - c.z, e = Math.hypot(ex, ez), m = c.r + 0.35; if (e < m && e > 1e-4) { h.p.x = c.x + ex / e * m; h.p.z = c.z + ez / e * m; } }
        else if (Math.abs(h.p.x - c.x) < c.hw + 0.35 && Math.abs(h.p.z - c.z) < c.hd + 0.35) { h.tgt = null; h.wait = 0.5; const ox = c.hw + 0.35 - Math.abs(h.p.x - c.x), oz = c.hd + 0.35 - Math.abs(h.p.z - c.z); if (ox < oz) h.p.x += Math.sign(h.p.x - c.x || 1) * ox; else h.p.z += Math.sign(h.p.z - c.z || 1) * oz; }
      }
    }
    h.sp.position.set(h.p.x, HAB_SIZE * 0.4 + Math.abs(Math.sin(t * 4 + h.ph)) * (h.wait > 0 ? 0.02 : 0.1), h.p.z);
  });
};

function renderAdv(el) {

function rollD20(el, choice) {
  el.innerHTML = `<div class="big" style="text-align:center">Tu lances le dé rouge…</div><div id="d20" style="font-size:64px;font-weight:800;text-align:center;color:#D62828;margin:12px 0">?</div>`;
  let n = 0; const iv = setInterval(() => { const e = $('#d20'); if (!e) return clearInterval(iv); e.textContent = 1 + Math.floor(Math.random() * 20); sfx('tink'); if (++n > 10) { clearInterval(iv); show(); } }, 90);
  const show = () => {
    const r = 1 + Math.floor(Math.random() * 20), low = choice.charAt(0).toLowerCase() + choice.slice(1);
    const txt = r === 20 ? `Coup critique ! ${choice} : c'est légendaire. Les trolls t'élèvent au rang de grande sage des marais.`
      : r === 1 ? `Échec critique… mais critique dans le bon sens : en voulant ${low}, tu trébuches, et un troll ému t'adopte. Il te porte jusqu'à la suite.`
      : r <= 7 ? `Tu tentes de ${low}… c'est raté, mais si joliment raté que tout le monde éclate de rire. On te laisse passer, par pure sympathie.`
      : r <= 14 ? `Tu choisis de ${low}. Ça marche, sans éclat, mais ça marche. Tu avances, fière comme une grenouille.`
      : `${choice} : un coup de maître ! Un troll écrase une petite larme d'émotion.`;
    $('#d20').textContent = r; sfx(r >= 15 ? 'chime' : r <= 7 ? 'boing' : 'pop');
    el.insertAdjacentHTML('beforeend', `<div class="big" style="margin:6px 0 14px">${txt}</div><button class="btn main" id="aNext" style="width:100%">Continuer</button>`);
    $('#aNext').onclick = () => { adv.i++; renderAdv(el); };
  };
}

/* ---------- Miss Terre : elle cache son jeu ---------- */
G.talkMissTerre = function () {
  const d = dndState(), nk = Object.keys(S.keys).length;
  if (!d.met) {
    const lines = [
      { name: 'Miss Terre', text: 'Bienvenue, voyageuse. Je t\'attendais. Enfin… je t\'attendais peut-être.' },
      { name: 'Miss Terre', text: 'Je suis Miss Terre. Ici, je raconte les histoires. Les héros, eux, décident.' },
      { name: 'Miss Terre', text: 'Tu veux savoir pourquoi tu es une grenouille ? Mmh. Je pourrais te le dire.' },
      { name: 'Miss Terre', text: 'Mais le jeu perdrait tout son sel. Roule un dé.' }

    if (S.zen && S.zen.met) lines.push({ name: 'Miss Terre', text: 'On t\'a dit que je voulais tout diriger ? Je raconte, c\'est tout. Ce n\'est pas la même chose.' });
    lines.push({ name: 'Miss Terre', text: 'La table, les cartes, les dés : tout est à toi. Surtout, amuse-toi.' });
    dialog(lines, () => { d.met = true; save(); showHint('Lance une partie de dés, à droite de la table.', 6000); });

  }
  if (S.ended) { dialog([{ name: 'Miss Terre', text: pick(['Tu as fini la partie. Celle-ci, du moins. Il y en a toujours une autre.', 'Je savais, oui. Depuis le début. Mais tu méritais de le découvrir toi-même.']) }]); return; }

  dialog([{ name: 'Miss Terre', text: pick([
    'Ce que tu cherches… sent plus fort que tu ne le crois.',
    'Les indices ? Tu en as déjà. Il faut juste les laisser… s\'affiner.',
    'Un sourire peut cacher bien des choses. Le mien aussi, d\'ailleurs.',
    `Six faces, six univers. Tu en as ${nk}. Coïncidence ? Roule un dé.`,
    'Roule un dé.'
  ]) }]);
};

/* ---------- Créatures : libellule, mante religieuse, lapinouche ---------- */
function makeLibellule(col = 0x2BB5B0) {
  const g = new THREE.Group(), m = M(col, { shininess: 80 });
  for (let i = 0; i < 5; i++) g.add(ball(0.045 - i * 0.004, m, 0, 0, -0.08 * i, 1));
  g.add(ball(0.06, m, 0, 0.01, 0.08, 1));
  [-1, 1].forEach(s => g.add(ball(0.035, M(0x1a3a5a, { shininess: 120 }), s * 0.04, 0.03, 0.11, 1)));
  const wingM = new THREE.MeshPhongMaterial({ color: 0xdff6ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide, shininess: 120 });
  g.wings = [];
  [[-1, 0.02], [1, 0.02], [-1, -0.06], [1, -0.06]].forEach(([s, z]) => { const w = mesh(new THREE.PlaneGeometry(0.28, 0.07), wingM, s * 0.15, 0.03, z); w.rotation.x = -Math.PI / 2; g.add(w); g.wings.push({ w, s }); });
  g.flap = t => g.wings.forEach(({ w, s }, i) => { w.rotation.z = s * Math.sin(t * 40 + i) * 0.5; });
  return g;
}
function makeMante(col = 0x6FAF5B) {
  const g = new THREE.Group(), m = M(col, { shininess: 30 });
  const ab = ball(0.12, m, 0, 0.55, -0.12, 1); ab.scale.set(0.7, 0.7, 1.9); g.add(ab);
  const thorax = cyl(0.04, 0.05, 0.42, 6, m, 0, 0.82, 0.05); thorax.rotation.x = -0.4; g.add(thorax);
  const head = mesh(new THREE.ConeGeometry(0.1, 0.12, 3), m, 0, 1.08, 0.14); head.rotation.x = Math.PI; g.add(head);
  [-1, 1].forEach(s => {
    g.add(ball(0.045, M(0xC9E3A6, { shininess: 100 }), s * 0.08, 1.11, 0.16, 1));
    g.add(ball(0.018, M(0x1a2a12), s * 0.09, 1.12, 0.2, 0));
    const ant = cyl(0.005, 0.005, 0.22, 3, m, s * 0.04, 1.22, 0.16); ant.rotation.z = -s * 0.4; g.add(ant);
    const arm = cyl(0.018, 0.022, 0.24, 5, m, s * 0.07, 0.92, 0.18); arm.rotation.x = -1.1; g.add(arm); // pattes ravisseuses repliées
    const fore = cyl(0.016, 0.02, 0.2, 5, m, s * 0.07, 0.86, 0.25); fore.rotation.x = 0.6; g.add(fore);
    for (let k = 0; k < 2; k++) { const lg = cyl(0.012, 0.012, 0.6, 4, m, s * 0.14, 0.32, -0.05 - k * 0.18); lg.rotation.z = s * 0.35; g.add(lg); }
  });
  return g;
}
function makeLapinouche(col = 0xFBF6EE) {
  const g = new THREE.Group(), m = M(col, { shininess: 10 }), pink = M(0xF4C0D1);
  const body = ball(0.2, m, 0, 0.2, 0, 2); body.scale.set(1, 0.95, 1.1); g.add(body);
  g.add(ball(0.15, m, 0, 0.44, 0.08, 2));
  [-1, 1].forEach(s => {
    const ear = ball(0.06, m, s * 0.06, 0.66, 0.05, 1); ear.scale.set(0.6, 2.2, 0.5); ear.rotation.z = -s * 0.15; g.add(ear);
    const inner = ball(0.04, pink, s * 0.06, 0.66, 0.075, 1); inner.scale.set(0.45, 1.9, 0.3); inner.rotation.z = -s * 0.15; g.add(inner);
    g.add(ball(0.025, M(0x2b2236, { shininess: 90 }), s * 0.06, 0.48, 0.21, 0));
    g.add(ball(0.03, M(0xF0A9A9), s * 0.09, 0.41, 0.19, 0));
  });
  g.add(ball(0.022, pink, 0, 0.43, 0.23, 0));
  g.add(ball(0.07, M(0xffffff), 0, 0.2, -0.22, 1));
  g.hop = (t, ph = 0) => { g.position.y = Math.abs(Math.sin(t * 4 + ph)) * 0.12; };
  return g;
}
/* Montgolfière aux couleurs du drapeau LGBTQIA+ (drapeau arc-en-ciel « Progress ») */
const PRIDE = [0xE40303, 0xFF8C00, 0xFFED00, 0x008026, 0x24408E, 0x732982, 0xFFFFFF, 0xF5A9B8, 0x5BCEFA, 0x613915, 0x1a1a1a];
function makeBalloon(s = 1) {
  const g = new THREE.Group();
  PRIDE.forEach((c, i) => {
    const seg = mesh(new THREE.SphereGeometry(3, 8, 10, i / PRIDE.length * Math.PI * 2, Math.PI * 2 / PRIDE.length, 0, Math.PI * 0.78), M(c, { shininess: 20, side: THREE.DoubleSide }), 0, 0, 0);
    g.add(seg);
  });
  g.children.forEach(c => c.scale.y = 1.15);
  const cone = mesh(new THREE.CylinderGeometry(1.35, 0.7, 1.1, 11, 1, true), M(0xF5A9B8, { side: THREE.DoubleSide }), 0, -2.9, 0); g.add(cone);
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const r = cyl(0.015, 0.015, 1.4, 3, M(0x8B6A45), Math.cos(a) * 0.75, -4.1, Math.sin(a) * 0.75); g.add(r); }
  g.add(cyl(0.75, 0.6, 0.6, 12, M(0x9A6B44), 0, -5.0, 0));
  g.scale.setScalar(s);
  return g;
}

  const libs = [makeLibellule(0x2BB5B0), makeLibellule(0xF25C8A)]; libs.forEach(l => { l.scale.setScalar(1.8); fx.add(l); });
  const buns = [0xFBF6EE, 0xF4D7E4, 0xE8D8C4].map(c => { const b = makeLapinouche(c); fx.add(b); return b; });
  a.s2Fx = t => {

  };
  a.spawns.sport = { x: -15, z: 7.4, face: 0 }; a.spawns.cuisine = { x: 15, z: 7.4, face: 0 };

}

/* ---------- Onglet « Enquête » du sac ---------- */
G.renderEnquete = function (el, rerender) {
  const z = s2State(), n = s2Clues();
  let h = `<div class="big" style="margin-bottom:6px">${z.solved ? 'Affaire résolue : Mante Ra est redevenue danseuse, et Glouglo nage tranquille.' : 'Où se cache Mante Ra ? Récolte un indice dans chacun des 5 nouveaux lieux.'}</div>`;
  if (!z.solved) {
    const pct = (10 - s2Bonds()) / 8 * 100;
    h += `<div class="step">Distance entre Mante Ra et le bassin de Glouglo : ${s2Bonds()} bonds</div><div class="prog"><div style="width:${pct}%;background:#97C459"></div></div>`;
  }
  h += S2_UNIVERS.map(u => z.clues[u.id]
    ? `<div class="card" style="margin-top:8px"><div class="t">${u.npc} · ${u.label}</div><div>${u.clue}</div></div>`
    : `<div class="card ghost" style="margin-top:8px"><div class="t">???</div><div>Indice à trouver : ${u.label}</div></div>`).join('');
  if (!z.solved && n >= 5 && !z.accused) h += `<button class="btn main" id="s2Accuse" style="width:100%;margin-top:14px;min-height:56px">Désigner la cachette de Mante Ra</button>`;
  if (!z.solved && z.accused) h += `<div class="card" style="margin-top:12px;border:2px solid #F6C26B"><div class="t">Cachette trouvée !</div><div>Cours au cinéma et ouvre la machine à popcorn.</div></div>`;
  h += `<div class="sec">Objets de la saison 2</div><div class="grid">` + S2_UNIVERS.map(u => z.keys[u.id] ? `<div class="card"><div class="t">${u.item}</div><div>${u.label}</div></div>` : `<div class="card ghost"><div class="t">???</div><div>${u.label}</div></div>`).join('') + `</div>`;

/* ---------- Mini-jeux en étapes (réutilisables, aucun échec possible) ---------- */
function runSteps(el, steps, done) {
  let i = 0, wonky = false;
  const next = () => {
    if (i >= steps.length) return done(wonky);
    const s = steps[i++], head = stepHead(i, steps.length, s.txt, s.sub);
    if (s.n) tapStep(el, head, s.label, s.n, s.snd || 'pop', next);
    else timingStep(el, head, s.label, ok => { if (!ok) wonky = true; sfx(ok ? 'chime' : 'boing'); G.tTimer = setTimeout(next, 250); });
  };
  next();
}
function resultView(el, title, name, sub, btns) {
  el.innerHTML = `<div class="big" style="text-align:center;font-weight:700">${title}</div>
    <div style="text-align:center;font-size:18px;margin:10px 0 4px">${esc(name)}</div>
    <div style="text-align:center;color:var(--mute);font-size:14px;margin-bottom:12px">${sub}</div>
    <div class="row">${btns.map((b, i) => `<button class="btn ${i === 0 ? 'main' : ''}" data-rb="${i}" style="flex:1;min-height:52px">${b[0]}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-rb]').forEach(b => b.onclick = () => btns[+b.dataset.rb][1]());
}

G.openGym = function (ex) {
  const e = GYM[ex], gy = gymState();
  openPanel(e.label, el => {
    runSteps(el, e.steps, wonky => {
      gy[ex] = (gy[ex] || 0) + 1; save(); sfx(wonky ? 'boing' : 'sparkle');
      const n = Object.keys(gy).length;
      resultView(el, wonky ? 'Raté… avec panache !' : 'Bravo !', wonky ? e.ko : e.ok, `Exercices différents essayés : ${Math.min(n, 5)} / 5`, [['Continuer', closePanel], ['Encore une fois', () => G.openGym(ex)]]);
    });
  }, () => { if (Object.keys(gy).length >= 3 && !s2State().keys.sport && (s2State().met || {}).sport) setTimeout(() => G.talkHalTere(true), 300); });
};
G.talkHalTere = function (auto) {
  const a = G.areas.sport, z = s2State(), gy = gymState(), n = Object.keys(gy).length;
  faceNpc(a.npc);
  if (!z.met || !z.met.sport) {
    if (auto) return;
    s2Met('sport');
    dialog([
      { name: 'Hal Tère', text: 'Salut, {nick} ! Bienvenue dans ma salle. Ici, pas de chrono, pas de record, pas de miroir qui juge.' },
      { name: 'Hal Tère', text: 'On bouge pour le plaisir. Et si tu tombes, on dit que c\'était de la danse contemporaine.' },
      { name: 'Hal Tère', text: 'Essaie trois activités différentes, à ton rythme. Je te raconterai ensuite un truc bizarre que j\'ai vu hier soir.' }
    ], () => showHint('Essaie 3 activités : tapis, vélo, haltères, yoga ou trampoline.', 7000));
    return;
  }
  if (!z.keys.sport && n >= 3) {
    giveS2Key('sport', [
      { name: 'Hal Tère', text: 'Trois activités ! Tu bouges comme un petit nuage heureux.' },
      { name: 'Hal Tère', text: 'Tiens, mon haltère plume. Elle ne pèse rien, comme les soucis quand on bouge un peu.' },
      { name: 'Hal Tère', text: 'Et maintenant, le truc bizarre…' }
    ]);
    return;
  }
  if (auto) return;
  if (!z.keys.sport) { dialog([{ name: 'Hal Tère', text: `Tu as essayé ${n} activité${n > 1 ? 's' : ''} sur 3. Pas de pression : le trampoline ne s'en va pas.` }]); return; }
  dialog([{ name: 'Hal Tère', text: pick([
    'Le meilleur exercice ? Celui qui te fait sourire.',
    'Une mante religieuse qui s\'étire, c\'est très élégant. Mais quand elle a faim, c\'est moins rassurant.',
    'Bois de l\'eau ! Glouglo serait d\'accord. Enfin, lui, il vit dedans.',
    'J\'ai essayé le yoga de la grenouille. Je suis resté coincé deux heures. Superbe expérience.'
  ]) }]);
};

function buildTerrier() {
  const soil = new THREE.MeshPhongMaterial({ map: soilTexture(), flatShading: true, shininess: 2 });
  const a = s2Room('terrier', { floor: 0x8B6A45, wallMat: soil, bg: 0x140c08, sky: 0xffe0b0, ground: 0x2a1a10, hemiI: 0.55, lamp: 0xffc070, lampI: 1.0, door: 0x8B5E3C });
  const g = a.group;
  // racines au plafond et sur les murs
  for (let i = 0; i < 14; i++) { const rt = cyl(0.03, 0.06, 1.2 + (i % 3) * 0.5, 5, M(0x8B6A45), -4 + i * 0.6, 3.6, -3.4 + (i % 2) * 0.1); rt.rotation.z = Math.sin(i) * 0.3; g.add(rt); }
  // champignons lumineux
  const glows = [];
  [[-3.9, -2.5], [3.9, 1.5], [-0.8, -3.2], [2.8, -3.2], [3.9, -2.6]].forEach(([x, z], i) => {
    g.add(cyl(0.04, 0.05, 0.25, 6, M(0xFBF6EE), x, 0.12, z));
    const cap = mesh(new THREE.SphereGeometry(0.16, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M([0xF4C0D1, 0x9fd8f0, 0xFFD23F][i % 3], { emissive: [0x5a2040, 0x204a5a, 0x5a4a10][i % 3] }), x, 0.25, z); g.add(cap); glows.push(cap);
  });
  // trous de cache-cache (mur du fond et mur droit)
  HOLES.forEach(([x, z], i) => {
    const h = mesh(new THREE.CircleGeometry(0.42, 16), M(0x1a0f08), x, 0.45, z + (i < 5 ? 0 : 0)); if (i === 5) { h.rotation.y = -Math.PI / 2; h.position.x = 4.38; } g.add(h);
    const rim = mesh(new THREE.TorusGeometry(0.44, 0.06, 5, 16), M(0x5a3a26), h.position.x - (i === 5 ? 0.01 : 0), 0.45, h.position.z + (i === 5 ? 0 : 0.01)); rim.rotation.y = h.rotation.y; g.add(rim);
  });
  a.interact.push({ x: 0.2, z: -2.4, r: 0.9, label: 'Cache-cache', act: () => G.openHideSeek() });
  // tas de coussins et lapinouches
  g.add(cyl(1.1, 1.2, 0.25, 16, M(0xD8A0B8), 2.4, 0.12, 1.2)); g.add(cyl(0.9, 1.0, 0.2, 16, M(0xF4C0D1), 2.4, 0.32, 1.2));
  colCirc(a, 2.4, 1.2, 1.1);
  a.interact.push({ x: 1.0, z: 1.6, r: 0.7, label: 'Câlin', act: () => G.openHug() });
  a.buns = [];
  const cols = [0xFBF6EE, 0xE8D8C4, 0xD9C7A3, 0xF4D7E4, 0xC9B8A8, 0xFFFFFF];
  for (let i = 0; i < 6; i++) { const b = makeLapinouche(cols[i]); const pile = i < 3; b.userData = pile ? { pile: true, x: 2.4 + Math.cos(i * 2.1) * 0.5, z: 1.2 + Math.sin(i * 2.1) * 0.5 } : { x: -2 + i * 0.6, z: 0.5, tx: 0, tz: 0, w: 0 }; b.position.set(b.userData.x, pile ? 0.42 : 0, b.userData.z); g.add(b); a.buns.push(b); }
  // table à carottes
  g.add(box(1.2, 0.08, 0.7, M(0xA87C55), -2.4, 0.7, -1.4)); [[-0.5, -0.28], [0.5, -0.28], [-0.5, 0.28], [0.5, 0.28]].forEach(([dx, dz]) => g.add(box(0.06, 0.7, 0.06, M(0xA87C55), -2.4 + dx, 0.35, -1.4 + dz)));
  for (let i = 0; i < 5; i++) { const c = mesh(new THREE.ConeGeometry(0.05, 0.3, 6), M(0xF28C38), -2.8 + i * 0.2, 0.8, -1.4); c.rotation.z = Math.PI / 2; g.add(c); }
  colRect(a, -2.4, -1.4, 0.65, 0.4);
  // Carot Line
  const cl = makeCarotLine(); cl.root.position.set(-1.0, 0, -2.2); g.add(cl.root); a.npc = cl;
  colCirc(a, -1.0, -2.2, 0.5);
  a.interact.push({ x: -1.2, z: -1.2, r: 0.6, label: 'Parler', act: () => G.talkCarotLine() });
  a.update = (t, dt) => {
    cl.update(t);
    glows.forEach((c, i) => c.scale.setScalar(1 + Math.sin(t * 1.5 + i) * 0.05));
    a.buns.forEach((b, i) => {
      const u = b.userData;
      if (u.pile) { b.position.y = 0.42 + Math.abs(Math.sin(t * 1.2 + i)) * 0.03; b.rotation.y = Math.sin(t * 0.4 + i) * 0.5; return; }
      if (u.w > 0) { u.w -= dt; b.position.y = 0; return; }
      if (!u.tx) { u.tx = rand(-3.5, 0.5); u.tz = rand(-0.4, 2.6); }
      const dx = u.tx - u.x, dz = u.tz - u.z, d = Math.hypot(dx, dz);
      if (d < 0.15) { u.tx = 0; u.w = rand(1, 3); } else { u.x += dx / d * 0.9 * dt; u.z += dz / d * 0.9 * dt; b.rotation.y = Math.atan2(dx, dz); }
      b.position.set(u.x, Math.abs(Math.sin(t * 6 + i)) * 0.15, u.z);
    });
  };
  return a;
}

/* ---------------- Déplacement et collisions ---------------- */
const PR = 0.32, SPEED = 4.125; // +25 % (v1.1)
function resolve(p) {
  const a = G.area, b = a.bounds;
  if (b.type === 'rect') { p.x = clamp(p.x, b.minX, b.maxX); p.z = clamp(p.z, b.minZ, b.maxZ); }
  else { const d = Math.hypot(p.x, p.z); if (d > b.r) { p.x *= b.r / d; p.z *= b.r / d; } }
  for (const c of a.colliders) {
    if (c.t === 'c') {
      const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + PR;
      if (d < m && d > 1e-4) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
    } else {
      const cx = clamp(p.x, c.x - c.hw, c.x + c.hw), cz = clamp(p.z, c.z - c.hd, c.z + c.hd);
      const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
      if (d < PR) {
        if (d > 1e-4) { p.x = cx + dx / d * PR; p.z = cz + dz / d * PR; }
        else { // à l'intérieur : sortir par le côté le plus proche
          const ox = c.hw - Math.abs(p.x - c.x), oz = c.hd - Math.abs(p.z - c.z);
          if (ox < oz) p.x = c.x + Math.sign(p.x - c.x || 1) * (c.hw + PR); else p.z = c.z + Math.sign(p.z - c.z || 1) * (c.hd + PR);
        }
      }
    }
  }
}
let curSpeed = 0;
function movePlayer(dt) {
  const m = (G.paused || G.dialogOpen || G.panelOpen || G.fading || G.camMode !== 'follow') ? { x: 0, z: 0 } : readMove();
  const p = G.player.root.position;
  const target = Math.hypot(m.x, m.z) * SPEED;
  curSpeed = lerp(curSpeed, target, 1 - Math.exp(-dt * 12));
  if (target > 0.01) {
    const face = Math.atan2(m.x, m.z);
    let d = face - G.player.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    G.player.root.rotation.y += d * (1 - Math.exp(-dt * 14));
    p.x += m.x * SPEED * dt; p.z += m.z * SPEED * dt;
  }
  resolve(p);
}

/* ---------------- Atelier de bijoux (mini-jeu relaxant, aucun échec possible) ---------------- */
const WONKY_NAMES = {
  collier: ['Collier qui doute un peu', 'Collier en pleine réflexion'], bracelet: ['Bracelet un peu timide', 'Bracelet qui fait la moue'],
  boucles: ['Boucles asymétriques assumées', 'Boucles qui se chamaillent'], bague: ['Bague existentielle', 'Bague qui hésite entre deux doigts'],
  chaine: ['Chaîne qui fait la sieste', 'Chaîne légèrement rêveuse'], septum: ['Septum de travers (très tendance)', 'Septum philosophe'],
  narine: ['Narine perplexe', 'Narine qui louche un peu']
};
let craft = null;
function drawJewel(cv, c, done) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height; x.clearRect(0, 0, W, H);
  const f = FINISH[c.finish || 'chrome'], col = '#' + f.color.toString(16).padStart(6, '0');
  const k = SIZE[c.size || 'moyen'].k, total = JTYPE[c.type].rings, n = Math.min(done ?? total, total);
  const cx = W / 2, cy = H / 2, R = c.type === 'collier' ? 92 : c.type === 'bracelet' || c.type === 'chaine' ? 72 : 46;
  const arc = c.type === 'chaine' ? Math.PI : Math.PI * 2;
  x.lineWidth = 4 * k + 1; x.strokeStyle = col;
  for (let i = 0; i < n; i++) {
    const a0 = (c.type === 'chaine' ? 0 : -Math.PI / 2) + arc * i / total;
    const wob = c.wonky ? Math.sin(i * 2.3) * 9 : 0;
    const px = cx + Math.cos(a0) * (R + wob), py = cy + Math.sin(a0) * (R + wob) * (c.type === 'chaine' ? 0.8 : 1);
    if (f.color < 0x404040) { x.strokeStyle = 'rgba(230,220,255,0.35)'; x.lineWidth = 4 * k + 4; x.beginPath(); x.ellipse(px, py, 9 * k + 4, 6 * k + 3, a0 + Math.PI / 2, 0, Math.PI * 2); x.stroke(); x.strokeStyle = col; x.lineWidth = 4 * k + 1; }
    x.beginPath(); x.ellipse(px, py, 9 * k + 4, 6 * k + 3, a0 + Math.PI / 2, 0, Math.PI * 2); x.stroke();
    if (f.color < 0x404040) { x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 1; x.beginPath(); x.arc(px - 2, py - 2, 3, 0, 1.5); x.stroke(); x.strokeStyle = col; x.lineWidth = 4 * k + 1; }
  }
  if (c.spikes && n >= total) {
    for (let s = 0; s < c.spikes; s++) {
      const a0 = (c.type === 'chaine' ? Math.PI * 0.2 : Math.PI * 0.15) + (c.type === 'chaine' ? Math.PI * 0.6 : Math.PI * 0.7) * (c.spikes === 1 ? 0.5 : s / (c.spikes - 1));
      const len = c.spike === 'long' ? 30 : c.spike === 'pyramide' ? 18 : 16, wid = c.spike === 'pyramide' ? 12 : 7;
      const bx = cx + Math.cos(a0) * (R + 8), by = cy + Math.sin(a0) * (R + 8) * (c.type === 'chaine' ? 0.8 : 1);
      x.save(); x.translate(bx, by); x.rotate(a0 + Math.PI / 2); x.fillStyle = col;
      if (f.color < 0x404040) { x.shadowColor = 'rgba(230,220,255,0.6)'; x.shadowBlur = 6; }
      x.beginPath(); x.moveTo(-wid, 0); x.lineTo(wid, 0); x.lineTo(0, -len); x.closePath(); x.fill();
      x.strokeStyle = 'rgba(255,255,255,0.4)'; x.lineWidth = 1; x.stroke(); x.restore();
    }
  }
}
function itemName(c) {
  if (c.wonky) return pick(WONKY_NAMES[c.type]);
  const base = c.type === 'collier' ? 'Collier sans fin' : JTYPE[c.type].label;
  return `${base} ${FINISH[c.finish].label}` + (c.spikes ? ` à pics ${SPIKE[c.spike].label}` : '');
}

   jamais en fichier local. Le service worker ne met en cache que les fichiers du jeu lui-même. */
if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  const addLink = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  addLink('manifest', 'manifest.webmanifest'); addLink('apple-touch-icon', 'apple-touch-icon.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
}

window.MDB = { G, get S() { return S; }, doAct, goArea: (n, s) => G.goArea(n, s, true) };
